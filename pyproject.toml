[project]
name = "tts-data-utils"
description = "Utilities for working with 2D data."
readme = "README.md"
requires-python = ">=3.6"
license = {text = "Apache-2.0"}
authors = [
  { name = "muszynsk", email = "matt.muszynski@jpl.nasa.gov" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "lark>=1.0.0",
    "docxtpl",
    "pandas",
    "pytest",
    "tabulate",
    "jinja2",
    "plotly",
    "jpl_time",
    "openpyxl",
    "datetime",
    "jpl-time",
    "tabulate",
    "pandas",
    "tts-utilities>=0.2.1,<1.0.0",
    "tts-html-utils>=0.4.2,<1.0.0"
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/NASA-JPL-Teamtools-Studio/tts_data_utils"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[build-system]
requires = [
    "setuptools", 
    "setuptools_scm",
    "toml", 
    "wheel", 
    "tts-utilities>=0.2.1,<1.0.0"
    ]
build-backend = "setuptools.build_meta"

